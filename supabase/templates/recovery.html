<!-- Provisional text: the team approves the final wording. Inline styles and hex values are on purpose:
     e-mail clients ignore CSS variables. The colors are brand-couro and brand-creme from design/tokens.json. -->
<div style="font-family: Arial, Helvetica, sans-serif; color: #1C1917; max-width: 480px; margin: 0 auto; padding: 24px;">
  <p style="font-size: 16px; line-height: 24px;">Você pediu para criar uma nova senha no painel da kort.</p>
  <p style="margin: 24px 0;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
       style="display: inline-block; background: #7A4E2D; color: #F7F4EF; text-decoration: none; font-weight: 600; font-size: 16px; padding: 12px 20px; border-radius: 12px;">
      Criar nova senha
    </a>
  </p>
  <p style="font-size: 14px; line-height: 20px; color: #6B635A;">
    O link vale por 1 hora e só funciona uma vez. Se não foi você, ignore este e-mail: sua senha continua a mesma.
  </p>
</div>
